# 持久化数据结构版本。服务只读取当前版本，遇到旧版本会拒绝启动并提示运行 jc_proxy_upgrade。
schema_version: 3

server:
  listen: ":8092"
  read_timeout: 30s
  # 流式接口建议保持 0s，避免长连接在固定时长后被服务端切断
  write_timeout: 0s
  idle_timeout: 90s
  shutdown_timeout: 10s
  # 可选 TLS / HTTPS 支持；同时填写 cert_file 和 key_file 即启用 HTTPS
  tls:
    cert_file: ""    # /path/to/cert.pem
    key_file: ""     # /path/to/key.pem
    min_version: "1.2"  # 1.2 | 1.3

admin:
  # 推荐默认关闭；启用后若 password / password_hash 都留空，首次启动会自动生成随机口令并打印到控制台
  enabled: false
  username: "admin"
  # 二选一：推荐 password_hash；若两者都留空，将在首次启动时自动生成随机口令
  password: ""
  password_hash: ""
  session_ttl: 12h
  audit_log_path: "./data/admin_audit.log"
  # 留空表示不限制来源地址；如需控制来源，可填写办公网/堡垒机 CIDR
  allowed_cidrs: []
  # 部署在反向代理 / LB 后时使用；仅当 RemoteAddr 命中这些 CIDR 时，才信任 X-Forwarded-For / X-Real-IP
  trusted_proxy_cidrs: []

storage:
  config:
    # 启动前配置：优先级为 环境变量 > .env > 本文件；运行时数据库配置不会反向覆盖这里
    # file | pgsql
    driver: "file"
    pgsql:
      dsn: "postgres://postgres:postgres@127.0.0.1:5432/jc_proxy?sslmode=disable"
      table: "jc_proxy_configs"
      record_key: "default"
      max_open_conns: 4
      max_idle_conns: 2
      conn_max_lifetime: 30m
  upstream_keys:
    # 启动前配置：切换 file/pgsql 后需要重启服务
    # file | pgsql
    driver: "file"
    file_path: "./data/upstream_keys.json"
    pgsql:
      dsn: "postgres://postgres:postgres@127.0.0.1:5432/jc_proxy?sslmode=disable"
      table: "jc_proxy_upstream_keys"
      max_open_conns: 4
      max_idle_conns: 2
      conn_max_lifetime: 30m

# vendors 是有序数组：id 不可变，是上游 Key 分区、聚合引用和运行统计的唯一标识；
# name 可以随时改，它同时是客户端调用路径的第一段（改名后旧地址立即 404）。
# 手写配置时可以省略 id，启动时会自动生成并写回。
vendors:
  - name: "openai"
    provider: "openai"
    # 单个下游请求最多允许产生的上游请求数（包含切号和聚合 child 切换）
    max_upstream_attempts: 10
    upstream:
      base_url: "https://api.openai.com"
      # 请求发送阶段预算（连接/上传），写完请求即停止，不限制后续长 SSE；0s 禁用。
      upload_timeout: 300s
      response_header_timeout: 300s
      body_timeout: 5m
      # 在最终响应开始前周期性发送 HTTP 102 Processing，避免 Cloudflare 等代理因长时间无响应断开。
      # 这是 interim response，不会写入最终响应体；设为 0s 可关闭。
      interim_response_interval: 30s
    load_balance: "round_robin" # round_robin | random | least_used | least_requests | lowest_latency | highest_success | adaptive
    # 仅 lowest_latency / highest_success / adaptive 使用；聚合入口应在 child 上配置。
    # 以下均为默认值，省略字段自动采用默认；时长在 JSON API 中为纳秒数。
    # performance:
    #   sample_ttl: 5m
    #   decay_duration: 5m          # 0s = TTL 到期立即回归中性评分
    #   exploration_interval: 10    # 每 N 次选 Key 可探索一次；0 禁用探索
    #   exploration_backoff_base: 1m
    #   exploration_backoff_max: 5m
    #   success_power: 2           # lowest_latency 默认 1，其余默认 2；范围 0–4
    #   inflight_weight: 1         # 范围 0–10，0 忽略当前并发
    #   latency_prior: 1s          # 无成功头耗时的初始参考；highest_success 不使用
    upstream_auth:
      mode: "bearer"
      header: "Authorization"
      prefix: "Bearer "
    client_auth:
      # 默认开启；无非空客户端密钥时接口返回 401，即使 enabled: false 也不放行。
      # 仅在配置了客户端密钥且显式设为 false 后，才允许匿名访问。
      enabled: true
      keys:
        - "client-key-a"
        - "client-key-b"
    client_headers:
      allowlist:
        - "Content-Type"
        - "Accept"
        - "User-Agent"
        - "Authorization"
        - "X-Request-Id"
    inject_headers:
      X-Gateway: "jc_proxy"
      X-Vendor: "{{vendor}}"
    path_rewrites:
      "/v1/chat/completions": "/v1/fim/completions"
      "/v1/files/*": "/v1/storage/*"
    # 可选请求插件，仅原始供应商可配置。默认不启用；按数组顺序执行。
    # 优先使用原生 Go 实现；builtin / script / source 三选一。
    # plugins:
    #   - name: "history-filter"
    #     builtin: "codex-history-filter"
    #     # script: "./plugins/codex-history-filter.js" # 改用脚本时移除 builtin
    #     methods: [POST]
    #     paths: ["/v1/responses", "/responses"] # 匹配路径重写后的路径
    #     timeout: 100ms
    #     max_body_bytes: 4194304
    # 完整接口、性能与限制见 docs/gateway-plugins.md。
    # 空策略仅统计并透传错误；按需配置规则，见 docs/gateway-behavior.md 第 5 节。
    error_policy: {}
    resin:
      enabled: true
      url: "http://127.0.0.1:2260/my-token"
      platform: "Default"
      mode: "reverse"

  - name: "anthropic"
    provider: "anthropic"
    max_upstream_attempts: 10
    upstream:
      base_url: "https://api.anthropic.com"
    load_balance: "least_requests"
    upstream_auth:
      mode: "header"
      header: "x-api-key"
      prefix: ""
    client_auth:
      enabled: false
      keys: []
    client_headers:
      allowlist:
        - "Content-Type"
        - "Accept"
        - "X-API-Key"
        - "Authorization"
    inject_headers:
      Anthropic-Version: "2023-06-01"
    path_rewrites:
      "/v1/messages": "/v1/messages"
    # 空策略仅统计并透传错误；按需配置规则，见 docs/gateway-behavior.md 第 5 节。
    error_policy: {}
    resin:
      enabled: false
      url: ""
      platform: "Default"
      mode: "reverse"
